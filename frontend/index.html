<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collateral Valuation Engine — Poonawalla Fincorp</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0a0e17;--bg-secondary:#111827;--bg-card:#1a1f2e;--bg-card-hover:#1f2537;
  --border:#2a3040;--border-accent:#3b4565;
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
  --teal:#00d4aa;--teal-dim:#00d4aa33;--amber:#f59e0b;--amber-dim:#f59e0b33;
  --red:#ef4444;--red-dim:#ef444433;--blue:#3b82f6;--purple:#8b5cf6;
  --green:#22c55e;--green-dim:#22c55e22;
  --font-sans:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,0.4);
}
html{font-size:15px}
body{font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}

/* TOP BAR */
.topbar{background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.topbar .logo{display:flex;align-items:center;gap:12px}
.topbar .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--teal),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
.topbar h1{font-size:1.15rem;font-weight:700;letter-spacing:-0.01em}
.topbar .subtitle{font-size:0.75rem;color:var(--text-muted);margin-top:2px}
.topbar .badge{background:var(--teal-dim);color:var(--teal);padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:600;letter-spacing:0.05em}

/* LAYOUT */
.container{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 68px)}

/* SIDEBAR */
.sidebar{background:var(--bg-secondary);border-right:1px solid var(--border);padding:24px;overflow-y:auto}
.sidebar h2{font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;font-weight:600}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:0.78rem;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.form-group select,.form-group input{width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:10px 14px;border-radius:var(--radius-sm);font-size:0.88rem;font-family:var(--font-sans);transition:border-color 0.2s}
.form-group select:focus,.form-group input:focus{outline:none;border-color:var(--teal)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.divider{height:1px;background:var(--border);margin:20px 0}
.btn-valuate{width:100%;padding:14px;background:linear-gradient(135deg,var(--teal),#0891b2);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.95rem;font-weight:700;cursor:pointer;letter-spacing:0.02em;transition:all 0.3s;font-family:var(--font-sans)}
.btn-valuate:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,212,170,0.3)}
.btn-valuate:active{transform:translateY(0)}
.btn-valuate.loading{opacity:0.7;pointer-events:none}

/* MAIN CONTENT */
.main{padding:28px;overflow-y:auto}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;text-align:center;color:var(--text-muted)}
.placeholder .icon{font-size:4rem;margin-bottom:16px;opacity:0.4}
.placeholder h2{font-size:1.5rem;color:var(--text-secondary);margin-bottom:8px}
.placeholder p{font-size:0.9rem;max-width:400px;line-height:1.6}

/* METRIC CARDS */
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all 0.3s;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.metric-card.teal::before{background:var(--teal)}
.metric-card.amber::before{background:var(--amber)}
.metric-card.blue::before{background:var(--blue)}
.metric-card.purple::before{background:var(--purple)}
.metric-card:hover{border-color:var(--border-accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.metric-label{font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:8px}
.metric-value{font-family:var(--font-mono);font-size:1.55rem;font-weight:700;line-height:1.2}
.metric-sub{font-size:0.78rem;color:var(--text-secondary);margin-top:6px}
.teal .metric-value{color:var(--teal)}
.amber .metric-value{color:var(--amber)}
.blue .metric-value{color:var(--blue)}
.purple .metric-value{color:var(--purple)}

/* SECTIONS */
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:border-color 0.3s}
.card:hover{border-color:var(--border-accent)}
.card-title{font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.full-width{grid-column:1/-1}

/* DRIVERS */
.driver-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.driver-row:last-child{border-bottom:none}
.driver-name{font-size:0.82rem;color:var(--text-secondary);width:200px;flex-shrink:0}
.driver-bar-wrap{flex:1;height:8px;background:var(--bg-primary);border-radius:4px;overflow:hidden}
.driver-bar{height:100%;border-radius:4px;transition:width 0.8s ease}
.driver-bar.positive{background:linear-gradient(90deg,var(--teal),#0891b2)}
.driver-bar.negative{background:linear-gradient(90deg,var(--red),#f97316)}
.driver-impact{font-family:var(--font-mono);font-size:0.82rem;font-weight:600;width:70px;text-align:right}
.driver-impact.pos{color:var(--teal)}
.driver-impact.neg{color:var(--red)}
.driver-agent{font-size:0.68rem;color:var(--text-muted);width:110px;text-align:right}

/* FRAUD */
.fraud-clear{display:flex;align-items:center;gap:10px;padding:16px;background:var(--green-dim);border:1px solid #22c55e44;border-radius:var(--radius-sm);color:var(--green);font-weight:500}
.fraud-flag{padding:14px 16px;background:var(--bg-primary);border-radius:var(--radius-sm);margin-bottom:10px;border-left:4px solid;display:flex;gap:14px;align-items:flex-start}
.fraud-flag.high{border-color:var(--red);background:var(--red-dim)}
.fraud-flag.medium{border-color:var(--amber);background:var(--amber-dim)}
.fraud-flag.low{border-color:var(--blue);background:var(--blue-dim)}
.fraud-badge{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:3px 10px;border-radius:4px;white-space:nowrap}
.fraud-badge.high{background:var(--red);color:#fff}
.fraud-badge.medium{background:var(--amber);color:#000}
.fraud-badge.low{background:var(--blue);color:#fff}
.fraud-detail h4{font-size:0.88rem;margin-bottom:4px}
.fraud-detail p{font-size:0.78rem;color:var(--text-secondary);line-height:1.5}

/* SCENARIO TABLE */
.scenario-table{width:100%;border-collapse:collapse}
.scenario-table th{font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
.scenario-table td{padding:10px 12px;font-family:var(--font-mono);font-size:0.88rem;border-bottom:1px solid var(--border)}
.scenario-table tr:last-child td{border-bottom:none}
.scenario-tag{font-size:0.68rem;padding:2px 8px;border-radius:4px;font-weight:600}
.tag-optimistic{background:var(--green-dim);color:var(--green)}
.tag-base{background:var(--teal-dim);color:var(--teal)}
.tag-pessimistic{background:var(--red-dim);color:var(--red)}

/* BREAKDOWN TABLE */
.breakdown-table{width:100%}
.breakdown-table tr{border-bottom:1px solid var(--border)}
.breakdown-table tr:last-child{border-bottom:none}
.breakdown-table td{padding:8px 0;font-size:0.84rem}
.breakdown-table td:first-child{color:var(--text-secondary)}
.breakdown-table td:last-child{text-align:right;font-family:var(--font-mono);font-weight:500}

/* AGENT TRACE */
.trace-toggle{cursor:pointer;color:var(--text-muted);font-size:0.82rem;display:flex;align-items:center;gap:8px;padding:12px 0;transition:color 0.2s}
.trace-toggle:hover{color:var(--text-primary)}
.trace-content{display:none;background:var(--bg-primary);border-radius:var(--radius-sm);padding:16px;margin-top:8px;max-height:500px;overflow-y:auto}
.trace-content.open{display:block}
.trace-content pre{font-family:var(--font-mono);font-size:0.75rem;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap}

/* CHART */
.chart-container{position:relative;height:220px;margin-top:8px}

/* CONFIDENCE RING */
.confidence-ring{width:100px;height:100px;position:relative;margin:0 auto 12px}
.confidence-ring svg{transform:rotate(-90deg)}
.confidence-ring .value{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:1.3rem;font-weight:700}

/* ANIMATIONS */
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.animate-in{animation:fadeInUp 0.5s ease forwards}
.animate-delay-1{animation-delay:0.1s;opacity:0}
.animate-delay-2{animation-delay:0.2s;opacity:0}
.animate-delay-3{animation-delay:0.3s;opacity:0}
.animate-delay-4{animation-delay:0.4s;opacity:0}

/* RESPONSIVE */
@media(max-width:1024px){.container{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--border)}.metrics-grid{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">CV</div>
    <div>
      <h1>Collateral Valuation Engine</h1>
      <div class="subtitle">AI-Powered Estimation Portal — Poonawalla Fincorp</div>
    </div>
  </div>
  <div class="badge">11 AGENTS &bull; REAL-TIME</div>
</div>

<div class="container">
  <aside class="sidebar">
    <h2>Property Input</h2>

    <div class="form-group">
      <label>City</label>
      <select id="city" onchange="updateLocalities()">
        <option>Pune</option><option>Mumbai</option><option>Bangalore</option>
        <option>Nagpur</option><option>Jaipur</option><option>Lucknow</option><option>Gorakhpur</option>
      </select>
    </div>
    <div class="form-group">
      <label>Locality</label>
      <select id="locality"></select>
    </div>

    <div class="divider"></div>

    <div class="form-row">
      <div class="form-group">
        <label>Property Type</label>
        <select id="prop_type">
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
          <option value="industrial">Industrial</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sub-Type</label>
        <select id="sub_type">
          <option value="apartment">Apartment</option><option value="villa">Villa</option>
          <option value="plot">Plot</option><option value="shop">Shop</option>
          <option value="warehouse">Warehouse</option><option value="office">Office</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Built-up Area (sqft)</label>
        <input type="number" id="area" value="850" min="100" max="50000">
      </div>
      <div class="form-group">
        <label>Age (years)</label>
        <input type="number" id="age" value="5" min="0" max="80">
      </div>
    </div>

    <div class="form-group">
      <label>Configuration</label>
      <select id="config">
        <option value="">None</option><option value="1BHK">1BHK</option>
        <option value="2BHK" selected>2BHK</option><option value="3BHK">3BHK</option>
        <option value="4BHK">4BHK</option><option value="5BHK">5BHK</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="form-row">
      <div class="form-group">
        <label>Ownership</label>
        <select id="ownership">
          <option value="freehold">Freehold</option>
          <option value="leasehold">Leasehold</option>
          <option value="">Unknown</option>
        </select>
      </div>
      <div class="form-group">
        <label>Title Clear</label>
        <select id="title_clear">
          <option value="true">Yes</option>
          <option value="false">No / Disputed</option>
          <option value="">Unknown</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Floor</label>
        <input type="number" id="floor" value="4" min="-1" max="50">
      </div>
      <div class="form-group">
        <label>Total Floors</label>
        <input type="number" id="total_floors" value="14" min="0" max="80">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Has Lift</label>
        <select id="has_lift"><option value="true">Yes</option><option value="false">No</option></select>
      </div>
      <div class="form-group">
        <label>Occupancy</label>
        <select id="occupancy">
          <option value="self_occupied">Self-Occupied</option>
          <option value="rented">Rented</option>
          <option value="vacant">Vacant</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Monthly Rent (INR) — 0 if not rented</label>
      <input type="number" id="rent" value="0" min="0" max="1000000" step="1000">
    </div>

    <div class="divider"></div>
    <button class="btn-valuate" id="btn" onclick="runValuation()">VALUATE PROPERTY</button>
  </aside>

  <main class="main" id="main-content">
    <div class="placeholder" id="placeholder">
      <div class="icon">🏦</div>
      <h2>Collateral Valuation Engine</h2>
      <p>Configure property details on the left panel and click <strong>VALUATE</strong> to run the 11-agent AI pipeline. Results appear here with full explainability.</p>
    </div>
    <div id="results" style="display:none"></div>
  </main>
</div>

<script>
const LOCALITIES = {
  Pune: ['Baner','Hinjewadi','Kothrud'],
  Mumbai: ['Andheri West','Bandra West','Dadar'],
  Bangalore: ['Whitefield'],
  Nagpur: ['Sitabuldi'],
  Jaipur: ['Malviya Nagar'],
  Lucknow: ['Gomti Nagar'],
  Gorakhpur: ['Civil Lines','Golghar']
};

function updateLocalities() {
  const city = document.getElementById('city').value;
  const sel = document.getElementById('locality');
  sel.innerHTML = '';
  (LOCALITIES[city]||[]).forEach(l => { const o = document.createElement('option'); o.value=l; o.textContent=l; sel.appendChild(o); });
}
updateLocalities();

function formatINR(n) {
  if (n >= 1e7) return '₹' + (n/1e7).toFixed(2) + ' Cr';
  if (n >= 1e5) return '₹' + (n/1e5).toFixed(2) + ' L';
  return '₹' + n.toLocaleString('en-IN');
}

async function runValuation() {
  const btn = document.getElementById('btn');
  btn.classList.add('loading');
  btn.textContent = 'RUNNING 11 AGENTS...';

  const body = {
    address: document.getElementById('locality').value + ', ' + document.getElementById('city').value,
    property_type: document.getElementById('prop_type').value,
    sub_type: document.getElementById('sub_type').value,
    built_up_area_sqft: +document.getElementById('area').value,
    age_years: +document.getElementById('age').value,
    configuration: document.getElementById('config').value || null,
    ownership: document.getElementById('ownership').value || null,
    title_clear: document.getElementById('title_clear').value === 'true' ? true : (document.getElementById('title_clear').value === 'false' ? false : null),
    floor: +document.getElementById('floor').value >= 0 ? +document.getElementById('floor').value : null,
    total_floors: +document.getElementById('total_floors').value || null,
    has_lift: document.getElementById('has_lift').value === 'true',
    occupancy: document.getElementById('occupancy').value || null,
    monthly_rent: +document.getElementById('rent').value || null,
  };

  try {
    const resp = await fetch('/valuate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    renderResults(data, body);
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    btn.classList.remove('loading');
    btn.textContent = 'VALUATE PROPERTY';
  }
}

function renderResults(d, input) {
  document.getElementById('placeholder').style.display = 'none';
  const el = document.getElementById('results');
  el.style.display = 'block';

  const mv = d.market_value_range || [0,0];
  const dv = d.distress_value_range || [0,0];
  const rpi = d.resale_potential_index || 0;
  const ttl = d.estimated_time_to_sell_days || [0,0];
  const conf = d.confidence_score || 0;
  const drivers = d.key_drivers || [];
  const flags = d.risk_flags || [];
  const scenarios = d.scenarios || {};
  const trace = d.agent_trace || {};
  const recommendation = d.collateral_recommendation || 'review_needed';
  const ltv = d.recommended_ltv_pct || 0;

  const rpiColor = rpi >= 60 ? 'teal' : (rpi >= 40 ? 'amber' : 'red');
  const confColor = conf >= 0.80 ? 'teal' : (conf >= 0.60 ? 'amber' : 'red');
  const rpiLabel = rpi >= 80 ? 'Highly Liquid' : (rpi >= 60 ? 'Moderately Liquid' : (rpi >= 40 ? 'Restricted' : (rpi >= 20 ? 'Illiquid' : 'Unsellable')));
  const confLabel = conf >= 0.85 ? 'High' : (conf >= 0.65 ? 'Medium' : (conf >= 0.45 ? 'Low' : 'Unreliable'));

  const recColors = {strong_accept:'var(--green)',accept:'var(--teal)',conditional_accept:'var(--amber)',review_needed:'var(--red)',reject:'var(--red)'};
  const recLabels = {strong_accept:'STRONG ACCEPT',accept:'ACCEPT',conditional_accept:'CONDITIONAL',review_needed:'REVIEW NEEDED',reject:'REJECT'};

  let driversHTML = '';
  drivers.forEach(dr => {
    const val = parseFloat(dr.impact);
    const isPos = val >= 0;
    const barW = Math.min(80, Math.abs(val) * 0.6);
    driversHTML += `<div class="driver-row">
      <div class="driver-name">${dr.factor.replace(/_/g,' ')}</div>
      <div class="driver-bar-wrap"><div class="driver-bar ${isPos?'positive':'negative'}" style="width:${barW}%"></div></div>
      <div class="driver-impact ${isPos?'pos':'neg'}">${dr.impact}</div>
      <div class="driver-agent">${dr.source_agent}</div>
    </div>`;
  });

  let flagsHTML = '';
  if (flags.length === 0) {
    flagsHTML = `<div class="fraud-clear">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="10" cy="10" r="9"/></svg>
      No fraud flags or risk indicators detected. Property passes all 7 checks.
    </div>`;
  } else {
    flags.forEach(f => {
      flagsHTML += `<div class="fraud-flag ${f.severity}">
        <span class="fraud-badge ${f.severity}">${f.severity}</span>
        <div class="fraud-detail">
          <h4>${(f.flag||'').replace(/_/g,' ')}</h4>
          <p>${f.explanation || 'Flagged by ' + (f.source_agent||'system') + ' agent'}</p>
          <p style="margin-top:4px;font-size:0.72rem;color:var(--text-muted)">Source: ${f.source_agent||'system'}</p>
        </div>
      </div>`;
    });
  }

  const scenBase = scenarios.base || {};
  const scenOpt = scenarios.optimistic || {};
  const scenPess = scenarios.pessimistic || {};

  el.innerHTML = `
    <div class="metrics-grid">
      <div class="metric-card teal animate-in animate-delay-1">
        <div class="metric-label">Market Value</div>
        <div class="metric-value">${formatINR(mv[0])}</div>
        <div class="metric-sub">to ${formatINR(mv[1])}</div>
      </div>
      <div class="metric-card amber animate-in animate-delay-2">
        <div class="metric-label">Distress Value</div>
        <div class="metric-value">${formatINR(dv[0])}</div>
        <div class="metric-sub">to ${formatINR(dv[1])}</div>
      </div>
      <div class="metric-card blue animate-in animate-delay-3">
        <div class="metric-label">Resale Potential Index</div>
        <div class="metric-value">${rpi}<span style="font-size:0.9rem;color:var(--text-muted)">/100</span></div>
        <div class="metric-sub">${rpiLabel}</div>
      </div>
      <div class="metric-card purple animate-in animate-delay-4">
        <div class="metric-label">Confidence</div>
        <div class="metric-value">${(conf*100).toFixed(0)}%</div>
        <div class="metric-sub">${confLabel} &bull; TTL ${ttl[0]}–${ttl[1]} days</div>
      </div>
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 22px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between" class="animate-in animate-delay-2">
      <div>
        <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Collateral Recommendation</span>
        <div style="font-size:1.2rem;font-weight:700;color:${recColors[recommendation]||'var(--text-primary)'};margin-top:4px">${recLabels[recommendation]||recommendation.toUpperCase()}</div>
      </div>
      <div style="text-align:right">
        <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Recommended LTV</span>
        <div style="font-size:1.4rem;font-weight:700;font-family:var(--font-mono);color:var(--teal)">${ltv}%</div>
      </div>
      <div style="text-align:right">
        <span style="font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Time to Sell</span>
        <div style="font-size:1.2rem;font-weight:700;font-family:var(--font-mono)">${ttl[0]}–${ttl[1]} <span style="font-size:0.8rem;color:var(--text-muted)">days</span></div>
      </div>
    </div>

    <div class="section-grid">
      <div class="card animate-in animate-delay-2">
        <div class="card-title"><span class="dot" style="background:var(--teal)"></span>Key Value Drivers</div>
        ${driversHTML}
      </div>

      <div class="card animate-in animate-delay-3">
        <div class="card-title"><span class="dot" style="background:var(--blue)"></span>Scenario Analysis</div>
        <table class="scenario-table">
          <thead><tr><th>Scenario</th><th>Low</th><th>High</th></tr></thead>
          <tbody>
            <tr><td><span class="scenario-tag tag-optimistic">Optimistic</span></td><td>${formatINR(scenOpt.range?scenOpt.range[0]:0)}</td><td>${formatINR(scenOpt.range?scenOpt.range[1]:0)}</td></tr>
            <tr><td><span class="scenario-tag tag-base">Base</span></td><td>${formatINR(mv[0])}</td><td>${formatINR(mv[1])}</td></tr>
            <tr><td><span class="scenario-tag tag-pessimistic">Pessimistic</span></td><td>${formatINR(scenPess.range?scenPess.range[0]:0)}</td><td>${formatINR(scenPess.range?scenPess.range[1]:0)}</td></tr>
          </tbody>
        </table>
        <div class="chart-container"><canvas id="scenarioChart"></canvas></div>
      </div>

      <div class="card animate-in animate-delay-3">
        <div class="card-title"><span class="dot" style="background:${flags.length?'var(--red)':'var(--green)'}"></span>Fraud & Risk Analysis</div>
        ${flagsHTML}
      </div>

      <div class="card animate-in animate-delay-4">
        <div class="card-title"><span class="dot" style="background:var(--purple)"></span>Valuation Breakdown</div>
        <table class="breakdown-table">
          <tr><td>Circle Rate</td><td>₹${(trace.location_intel?.circle_rate_per_sqft||0).toLocaleString()}/sqft</td></tr>
          <tr><td>Market-to-Circle Ratio</td><td>${trace.location_intel?.mcr||'—'}x (${trace.location_intel?.micro_bucket||'—'})</td></tr>
          <tr><td>Infra Score (S_infra)</td><td>${trace.location_intel?.infra_score||'—'}</td></tr>
          <tr><td>Neighbourhood (S_nbhd)</td><td>${trace.location_intel?.neighborhood_quality||'—'}</td></tr>
          <tr><td>Age Factor (f_age)</td><td>${trace.property_char?.f_age||'—'}</td></tr>
          <tr><td>Config Factor (f_cfg)</td><td>${trace.property_char?.f_cfg||'—'}</td></tr>
          <tr><td>Legal Factor (f_legal)</td><td>${trace.legal?.f_legal||'—'}</td></tr>
          <tr><td>Floor Factor (f_floor)</td><td>${trace.property_char?.f_floor||'—'}</td></tr>
          <tr><td><strong>Point Estimate</strong></td><td><strong>${formatINR(trace.valuation?.point_estimate||0)}</strong></td></tr>
          <tr><td>Uncertainty Band</td><td>±${((trace.valuation?.uncertainty||0)*100).toFixed(1)}%</td></tr>
        </table>
      </div>

      <div class="card animate-in animate-delay-4">
        <div class="card-title"><span class="dot" style="background:var(--amber)"></span>RPI Component Breakdown</div>
        <div class="chart-container"><canvas id="rpiChart"></canvas></div>
      </div>

      <div class="card animate-in animate-delay-4">
        <div class="card-title"><span class="dot" style="background:var(--teal)"></span>Confidence Components</div>
        <div class="chart-container"><canvas id="confChart"></canvas></div>
      </div>

      <div class="card full-width animate-in animate-delay-4">
        <div class="card-title"><span class="dot" style="background:var(--text-muted)"></span>Explanation</div>
        <p style="font-size:0.92rem;line-height:1.7;color:var(--text-secondary)">${d.explanation||'No explanation available.'}</p>
      </div>

      <div class="card full-width animate-in animate-delay-4">
        <div class="trace-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l3-3-3-3"/></svg>
          Full Agent Trace (JSON) — Click to expand
        </div>
        <div class="trace-content"><pre>${JSON.stringify(trace, null, 2)}</pre></div>
      </div>
    </div>
  `;

  // Scenario chart
  setTimeout(() => {
    const sCtx = document.getElementById('scenarioChart');
    if (sCtx) new Chart(sCtx, {type:'bar',data:{labels:['Optimistic','Base','Pessimistic'],datasets:[
      {label:'Low',data:[scenOpt.range?scenOpt.range[0]:0,mv[0],scenPess.range?scenPess.range[0]:0],backgroundColor:'rgba(0,212,170,0.3)',borderColor:'rgba(0,212,170,0.8)',borderWidth:1},
      {label:'High',data:[scenOpt.range?scenOpt.range[1]:0,mv[1],scenPess.range?scenPess.range[1]:0],backgroundColor:'rgba(59,130,246,0.3)',borderColor:'rgba(59,130,246,0.8)',borderWidth:1}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11}}}},scales:{y:{ticks:{color:'#64748b',callback:v=>formatINR(v)},grid:{color:'#1e293b'}},x:{ticks:{color:'#94a3b8'},grid:{display:false}}}}});

    const rpiComp = trace.liquidity?.rpi_components || {};
    const rCtx = document.getElementById('rpiChart');
    if (rCtx) new Chart(rCtx, {type:'radar',data:{labels:['Infra','Config','Supply-Demand','Legal','Age','Yield'],datasets:[{
      label:'RPI Components',data:[rpiComp.s_infra||0,rpiComp.s_cfg||0,rpiComp.s_ds||0,rpiComp.s_legal||0,rpiComp.s_age_liq||0,rpiComp.s_yield||0],
      backgroundColor:'rgba(0,212,170,0.15)',borderColor:'var(--teal)',pointBackgroundColor:'var(--teal)',pointRadius:4
    }]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:1,ticks:{display:false,stepSize:0.2},grid:{color:'#2a3040'},pointLabels:{color:'#94a3b8',font:{size:11}}}}}});

    const confComp = trace.valuation?.confidence_components || {};
    const cCtx = document.getElementById('confChart');
    if (cCtx) new Chart(cCtx, {type:'doughnut',data:{labels:['Data Quality','Source Agreement','Locality Density','Fraud Penalty'],datasets:[{
      data:[confComp.q_data||0,confComp.q_agree||0,confComp.q_density||0,1-(confComp.p_fraud||0)],
      backgroundColor:['rgba(0,212,170,0.6)','rgba(59,130,246,0.6)','rgba(139,92,246,0.6)','rgba(245,158,11,0.6)'],borderColor:'var(--bg-card)',borderWidth:3
    }]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:11},padding:12}}}}});
  }, 100);
}
</script>
</body>
</html>
